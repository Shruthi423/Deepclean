[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepclean-context"
version = "0.4.0"
description = "Human-reviewed context cleanup for long Claude Code and Codex sessions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Shruthi Aragonda" }
]
dependencies = []
keywords = ["claude-code", "codex", "context", "llm", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/Shruthi423/Deepclean"
Repository = "https://github.com/Shruthi423/Deepclean"
Issues = "https://github.com/Shruthi423/Deepclean/issues"

[project.scripts]
deepclean = "deepclean.cli:main"

[tool.setuptools.packages.find]
include = ["deepclean*"]

[tool.setuptools.package-data]
deepclean = [
  "assets/claude/*.md",
  "assets/vscode/package.json",
  "assets/vscode/*.js",
  "assets/vscode/*.md",
]
